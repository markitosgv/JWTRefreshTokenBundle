name: Rector and PHP-CS-Fixer

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  rector:
    name: Rector and PHP-CS-Fixer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        extensions: ['curl, iconv, mbstring, mongodb, pdo, pdo_sqlite, sqlite, zip']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}

      - name: Update Composer dependencies
        run: composer update

      # --dry-run so this reports rather than rewrites. A pull request that leaves something for
      # Rector to do fails here with the diff in the log, which is the whole reason the tool was in
      # composer.json: it was installed for a long time with nothing configured to run it.
      - name: Rector
        run: bin/rector process --dry-run --no-progress-bar

      # Same reason, and the two are configured to agree: .php-cs-fixer.php and rector.php each say
      # which of them owns the rules they both have an opinion about.
      - name: PHP-CS-Fixer
        run: bin/php-cs-fixer fix --dry-run --diff
