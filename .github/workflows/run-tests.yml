name: 'Run Tests'

on: [push, pull_request]

jobs:
  test:
    runs-on: 'ubuntu-22.04'
    continue-on-error: ${{ matrix.can-fail }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.0.*', '7.2.*', '7.3.*', '7.4.*', '8.0.*', '8.1.*']
        composer-flags: ['--prefer-stable']
        can-fail: [false]
        extensions: ['curl, iconv, mbstring, mongodb, pdo, pdo_sqlite, sqlite, zip']
        exclude:
          # Symfony 8 needs PHP 8.4
          - php: '8.2'
            symfony: '8.0.*'
          - php: '8.3'
            symfony: '8.0.*'
          - php: '8.2'
            symfony: '8.1.*'
          - php: '8.3'
            symfony: '8.1.*'
        include:
          - php: '8.2'
            symfony: '6.4.*'
            composer-flags: '--prefer-stable --prefer-lowest'
            can-fail: false
            extensions: 'curl, iconv, mbstring, mongodb, pdo, pdo_sqlite, sqlite, zip'

    name: "PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}${{ matrix.composer-flags != '' && format(' - Composer {0}', matrix.composer-flags) || '' }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-symfony-${{ matrix.symfony }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}-flags-${{ matrix.composer-flags }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, flex
          extensions: ${{ matrix.extensions }}
          coverage: none

      - name: Setup MongoDB
        id: setup-mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: '6.0'
          topology: server

      - name: Install dependencies
        run: composer update ${{ matrix.composer-flags }} --prefer-dist 
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}

      - name: Run PHPUnit
        run: bin/phpunit
        env:
          DOCTRINE_MONGODB_SERVER: ${{ steps.setup-mongodb.outputs.cluster-uri }}

  coverage:
    runs-on: 'ubuntu-22.04'
    name: 'Coverage'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: 'curl, iconv, mbstring, mongodb, pdo, pdo_sqlite, sqlite, zip'
          coverage: pcov

      # The document repository is only exercised with a server available, so the report would
      # understate the coverage without it
      - name: Setup MongoDB
        id: setup-mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: '6.0'
          topology: server

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist

      - name: Run PHPUnit with coverage
        run: bin/phpunit --coverage-clover coverage.xml
        env:
          DOCTRINE_MONGODB_SERVER: ${{ steps.setup-mongodb.outputs.cluster-uri }}

      - name: Report coverage
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: clover

  lint:
    runs-on: 'ubuntu-22.04'
    name: 'Markdown Linting'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run markdownlint
        uses: articulate/actions-markdownlint@v1
