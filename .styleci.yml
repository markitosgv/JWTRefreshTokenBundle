# Formatting for the hosted check.
#
# php-cs-fixer is what decides how this codebase is formatted: it is in composer.json, it runs in
# CI, it is configurable rule by rule, and .php-cs-fixer.php holds it to the current @Symfony
# preset. This file exists so the hosted check agrees with it rather than competing with it.
#
# It is set to PSR-2 rather than to StyleCI's own symfony preset on purpose. That preset is a
# snapshot of php-cs-fixer from several major versions ago and disagrees with the current convention
# in three places: it drops the blank line between the class and function import groups, puts
# parentheses on anonymous classes, and indents a comment before a `} elseif` with the block above
# rather than with the chain. Symfony's convention is what this project follows, and the
# disagreement could not be configured away — the rules involved carry php-cs-fixer 3.x names that
# this vocabulary does not know, so naming them under `disabled` did nothing at all.
#
# PSR-2 has no opinion about any of the three. What is left is a baseline both tools agree on: the
# hosted check still catches what it is good at, and nothing it reports contradicts what
# php-cs-fixer will do to the same file.
preset: psr2

# Two more that both tools apply identically, so whichever runs first catches them.
enabled:
  - no_unused_imports
  - single_blank_line_at_eof
